{% extends "base.html" %}
{% block title %}注册 - Phigros OJ{% endblock %}
{% block content %}
<h1>注册</h1>
<form method="post" action="/register" class="card" style="max-width:400px;">
  <label>用户名 <input type="text" name="username" autocomplete="username" required></label>
  <label>显示昵称 <input type="text" name="display_name" autocomplete="nickname"></label>
  <label>密码 <input type="password" name="password" autocomplete="new-password" required></label>
  <button type="submit">注册</button>
  <p class="muted">首个注册用户将自动成为管理员。</p>
</form>
{% endblock %}
