{% extends "base.html" %}
{% block title %}登录 - Phigros OJ{% endblock %}
{% block content %}
<h1>登录</h1>
<form method="post" action="/login" class="card" style="max-width:400px;">
  <label>用户名 <input type="text" name="username" autocomplete="username" required></label>
  <label>密码 <input type="password" name="password" autocomplete="current-password" required></label>
  <button type="submit">登录</button>
  <p class="muted">没有账号？<a href="/register">注册</a></p>
</form>
{% endblock %}
